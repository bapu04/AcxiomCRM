# FraudGraph AI Spring Boot Configuration

server.port=8080
spring.application.name=fraudgraph-backend

# Profiles: dev (h2 for zero-config run) or mysql
spring.profiles.active=dev

# H2 Database Settings (Default / Dev Profile)
spring.datasource.url=jdbc:h2:mem:fraudgraph_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=FraudGraphAIAdaptiveFraudDetectionUnderConceptDriftSuperSecretKey20261027
app.jwt.expiration-ms=86400000

# Fraud Detection Engine Parameters
fraud.engine.velocity-window-minutes=10
fraud.engine.zscore-threshold=3.0
fraud.engine.cycle-max-depth=4
fraud.engine.drift-window-size=50
fraud.engine.drift-threshold=0.38
